name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proyectos/01-gestor-tareas

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: proyectos/01-gestor-tareas/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: proyectos/01-gestor-tareas/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db?schema=public"
          DIRECT_URL: "postgresql://user:pass@localhost:5432/db?schema=public"

      - name: Generate Prisma Client
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db?schema=public"
          DIRECT_URL: "postgresql://user:pass@localhost:5432/db?schema=public"

      - name: Biome check
        run: pnpm exec biome check .

      - name: Run tests
        run: pnpm test
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db?schema=public"
          DIRECT_URL: "postgresql://user:pass@localhost:5432/db?schema=public"

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db?schema=public"
          DIRECT_URL: "postgresql://user:pass@localhost:5432/db?schema=public"
